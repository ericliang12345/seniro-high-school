<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高一數學｜第一次段考｜第一章 數與式</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f5f7fb;color:#17253b;line-height:1.85}header{background:linear-gradient(125deg,#142a4e,#2857a0);color:white;padding:42px 20px}header .wrap{max-width:1120px;margin:auto}h1{font-size:clamp(28px,5vw,44px);margin:5px 0}header p{opacity:.88}main{max-width:1120px;margin:auto;padding:22px 16px 70px}.toolbar{position:sticky;top:0;z-index:4;background:#f5f7fbef;backdrop-filter:blur(12px);border-bottom:1px solid #e0e5ee;padding:10px 0;display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.toolbar input{padding:9px 13px;border-radius:10px;border:1px solid #cbd5e1;background:white;font-size:14px}.toolbar button{cursor:pointer}.toolbar input{flex:1;min-width:130px}.chip{display:inline-block;background:#e6efff;color:#194785;border-radius:30px;padding:3px 11px;font-size:12px;font-weight:700}.unit{background:white;border:1px solid #e1e7f0;border-radius:18px;margin:24px 0;overflow:hidden;box-shadow:0 4px 20px #182b4a0a}.unit-head{padding:22px 24px;background:#eef4ff}.unit h2{font-size:24px;margin:6px 0}.unit .body{padding:20px 24px}.formulas{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.formula{border:1px solid #d9e5fa;background:#f8fbff;border-radius:12px;padding:14px}.formula strong{color:#1b4b8c;display:block}.math{font-family:"Cambria Math",Georgia,serif;font-size:17px;overflow-wrap:anywhere;white-space:pre-wrap}.examples h3{margin:24px 0 10px}.problem{border:1px solid #e1e7ee;border-radius:12px;padding:15px;margin:12px 0;background:#fff}.problem .q{font-weight:650}.tag{font-size:12px;background:#f0f2f7;padding:2px 9px;border-radius:12px;color:#475569}.problem details{margin-top:10px}.problem summary{cursor:pointer;color:#2159aa;font-weight:700;user-select:none}.solution{border-top:1px dashed #cbd5e1;margin-top:10px;padding-top:12px}.solution ol{padding-left:23px}.solution li{margin:7px 0}.answer{background:#edf8f3;border-left:4px solid #16a374;padding:9px 12px;border-radius:6px}.foot{color:#64748b;font-size:13px}.progress{height:9px;background:#dce5f3;border-radius:9px;overflow:hidden;max-width:260px}.bar{height:100%;width:0;background:#34b399;transition:.2s}.done{display:flex;gap:8px;align-items:center;color:#52627a;font-size:13px}.empty{display:none}a{color:#1d4d93;text-decoration:none}@media(max-width:600px){.unit .body{padding:14px}.unit-head{padding:16px}.formula{padding:12px}.math{font-size:16px}}@media print{header{background:#fff;color:#000}.toolbar,.done{display:none}.unit{break-inside:avoid;box-shadow:none}.problem details:not([open]) .solution{display:block}}</style></head><body><header><div class="wrap"><span class="chip">高一第一次段考 · 離線互動複習</span><h1>第一章｜數與式</h1><p>從基本觀念到進階應用 · 每題獨立顯示詳解 · 六大單元</p><div class="progress"><div id="bar" class="bar"></div></div><small id="status">0 題已完成</small></div></header><main><div class="toolbar"><input id="search" placeholder="搜尋題目或觀念…" aria-label="搜尋題目"><button id="show">全部展開詳解</button><button id="hide">全部隱藏詳解</button><button onclick="window.print()">列印 / 存 PDF</button></div><nav class="foot">快速跳轉：<a href="#unit1">乘法公式</a> · <a href="#unit2">有理數</a> · <a href="#unit3">根式</a> · <a href="#unit4">實數運算</a> · <a href="#unit5">均值不等式</a> · <a href="#unit6">絕對值</a></nav><p class="foot">整理自上傳講義「數與式」第 1–15 頁。部分例題經重新敘述；若與原講義數值不一致，以原講義為準。完成狀態只在本頁開啟期間保留。</p><div id="content"></div><p class="foot">本頁為單一 HTML，所有樣式與程式均內嵌，無須網路。</p></main><script>const DATA=[{"title": "乘法公式、分解公式", "desc": "看到平方、立方或對稱式，先找結構，不要急著展開。", "formulas": [["平方和與平方差", "(a+b)²=a²+2ab+b²；(a−b)²=a²−2ab+b²；a²−b²=(a+b)(a−b)"], ["立方公式", "(a+b)³=a³+3a²b+3ab²+b³；(a−b)³=a³−3a²b+3ab²−b³"], ["立方和差", "a³+b³=(a+b)(a²−ab+b²)；a³−b³=(a−b)(a²+ab+b²)"], ["三數平方", "(a+b+c)²=a²+b²+c²+2ab+2bc+2ca"], ["常用變形", "a³+b³=(a+b)³−3ab(a+b)；a³−b³=(a−b)³+3ab(a−b)"]], "examples": [{"q": "已知 a+b=5、ab=1，判斷哪些敘述正確：a²+b²=23、|a−b|=√21、a³+b³=110、a⁴+b⁴=527、a⁵+b⁵=2525。", "steps": ["a²+b²=(a+b)²−2ab=25−2=23。", "(a−b)²=(a+b)²−4ab=25−4=21，所以 |a−b|=√21。", "a³+b³=(a+b)³−3ab(a+b)=125−15=110。", "a⁴+b⁴=(a²+b²)²−2a²b²=23²−2=527。", "a⁵+b⁵=(a²+b²)(a³+b³)−(ab)²(a+b)=23×110−5=2525。"], "ans": "五項皆正確", "tag": "基礎"}, {"q": "已知 a=(0.1)^(1/3)，求 (a+2)(a−2)(a⁴+4a²+16)。", "steps": ["先用平方差：(a+2)(a−2)=a²−4。", "(a²−4)(a⁴+4a²+16)=a⁶−64。", "a³=0.1，所以 a⁶=0.01。"], "ans": "−63.99", "tag": "進階"}, {"q": "設 a=(√5+1)/(√5−1)、b=(√5−1)/(√5+1)，求 a³+b³。", "steps": ["有理化：a=(3+√5)/2、b=(3−√5)/2。", "a+b=3、ab=1。", "a³+b³=(a+b)³−3ab(a+b)=27−9。"], "ans": "18", "tag": "常考"}, {"q": "已知 x=∛5−1/∛5，求 5x³+15x+1。", "steps": ["令 a=∛5、b=1/∛5，ab=1，x=a−b。", "x³=(a−b)³=a³−b³−3x。", "因此 x³+3x=5−1/5=24/5。", "兩邊乘以5，再加1。"], "ans": "25", "tag": "進階"}, {"q": "若 x²−3x−1=0，求 x⁵−x⁻⁵。", "steps": ["因 x≠0，兩邊除以 x，得到 x−1/x=3。", "(x−1/x)²=x²+x⁻²−2=9，所以 x²+x⁻²=11。", "x³−x⁻³=(x−x⁻¹)(x²+1+x⁻²)=3×12=36。", "x⁵−x⁻⁵=(x²+x⁻²)(x³−x⁻³)−(x−x⁻¹)=11×36−3。"], "ans": "393", "tag": "常考"}, {"q": "因式分解 25x⁴+31x²+16。", "steps": ["拆中間項：25x⁴+40x²+16−9x²。", "=(5x²+4)²−(3x)²。", "再使用平方差。"], "ans": "(5x²+3x+4)(5x²−3x+4)", "tag": "常考"}, {"q": "求 25x⁴+31x²+16 的分解。", "steps": ["補成平方：(5x²+4)²−(3x)²。", "使用 A²−B²=(A+B)(A−B)。"], "ans": "(5x²+3x+4)(5x²−3x+4)", "tag": "基礎"}]}, {"title": "有理數、無理數與循環小數", "desc": "有理數就是「能寫成兩個整數的分數」；無理數不能。", "formulas": [["數系分類", "自然數 ⊂ 整數 ⊂ 有理數 ⊂ 實數；實數=有理數∪無理數"], ["小數判別", "有限小數、無限循環小數是有理數；無限不循環小數是無理數"], ["分母判別", "最簡分數的分母只含質因數 2、5 → 有限小數；否則循環小數"], ["循環小數化分數", "0.abcabc…=abc/999；0.ababab…=ab/99；非循環前段用相減消去"], ["根式判別", "√n 不一定無理，例如 √9=3；√2×√2=2"]], "examples": [{"q": "已知 n 為正整數，12−n/n < 2−√3 < 13−n/(n−1)，求 n。", "steps": ["2−√3≈0.268。", "將左右式寫成 12/n−1 與 12/(n−1)−1。", "移項後：12/n<3−√3<12/(n−1)。", "取倒數（皆正）得到 n−1<12/(3−√3)<n。", "12/(3−√3)=6+2√3≈9.464。"], "ans": "n=10", "tag": "進階"}, {"q": "下列哪些數是有限小數？1/√2、1170/(3²×5¹³)、213/97、3/π、3⁶/(2⁵×5⁷)。", "steps": ["1/√2=√2/2，無理數，不是有限小數。", "1170=2×3²×5×13，約分後仍有因數13，非有限小數。", "213/97 最簡分母有97，為循環小數。", "3/π 為無理數。", "3⁶/(2⁵×5⁷) 分母只含2、5，為有限小數。"], "ans": "只有第 (5) 項", "tag": "常考"}, {"q": "判斷：「a、b 都是無理數，則 ab 必為無理數」對不對？", "steps": ["舉反例即可：a=√2、b=√2。", "ab=2，是有理數。"], "ans": "錯", "tag": "易錯"}, {"q": "99999=9×41×271，設 a=17/40+2/271，求小數點後第 2024 位數字。", "steps": ["17/40=0.425，2/271 是循環小數。", "先把兩項通分，或利用講義列出的循環節 0.4323800738… 判斷。", "循環前段與循環節長度要分開計算；不可直接以 2024 除循環節長。"], "ans": "3", "tag": "進階"}, {"q": "已知 a 是 1～9 的正整數，17/90 < 0.1a̅3 < 1/5，求 a。", "steps": ["17/90≈0.1889，1/5=0.2。", "0.1a̅3 介於 0.18… 和 0.2 之間。", "依原講義循環記號，a 為循環位，試代符合範圍的數字。"], "ans": "9", "tag": "常考"}, {"q": "將 0.123123123… 化成分數。", "steps": ["令 x=0.123123…", "1000x=123.123123…", "相減：999x=123。", "所以 x=123/999，約分。"], "ans": "41/333", "tag": "基礎"}]}, {"title": "根式、無理數與有理化", "desc": "根號先化簡，再運算；遇到分母有根號，用共軛式消掉。", "formulas": [["根式乘除", "√a√b=√(ab)（a,b≥0）；√(a²)=|a|"], ["同類根式", "2√3+5√3=7√3；√8=2√2"], ["分母有理化", "1/(√a+√b)=(√a−√b)/(a−b)（a≠b）"], ["雙重根號", "√(a+b+2√ab)=√a+√b；√(a+b−2√ab)=|√a−√b|"], ["無理數的稠密性", "任意兩個不同實數之間，都有無限多個有理數和無理數"]], "examples": [{"q": "化簡 √(21+12√3)−√(28−10√3)。", "steps": ["21+12√3=12+9+2√(12×9)=(2√3+3)²。", "28−10√3=25+3−2√(25×3)=(5−√3)²。", "所以原式=(2√3+3)−(5−√3)。"], "ans": "3√3−2", "tag": "常考"}, {"q": "設 a 是 5+√32 的小數部分，求 √2 的小數部分。", "steps": ["√32=4√2=5.656…，5+√32=10.656…。", "小數部分 a=4√2−5。", "√2=1.414…，小數部分是 √2−1。"], "ans": "√2−1", "tag": "基礎"}, {"q": "設 √(a+b+2√ab)=√a+√b，成立條件為何？", "steps": ["必須 a≥0、b≥0。", "(√a+√b)²=a+b+2√ab。", "根號值非負，因此可以直接開方。"], "ans": "a≥0 且 b≥0", "tag": "觀念"}, {"q": "比較 √119−√118 與 √120−√119 的大小。", "steps": ["用共軛式：√119−√118=1/(√119+√118)。", "√120−√119=1/(√120+√119)。", "第二個分母較大，值較小。"], "ans": "√119−√118 較大", "tag": "常考"}, {"q": "若 a、b 為有理數，且 (−2a+3b)+(3a+2b)√2=−13，求 a、b。", "steps": ["因 1 與 √2 在有理係數下線性獨立。", "分別比較：−2a+3b=−13；3a+2b=0。", "由第二式 b=−3a/2，代回得 −13a/2=−13。"], "ans": "a=2、b=−3", "tag": "常考"}, {"q": "求 √(11+3√8) 的化簡。", "steps": ["3√8=6√2。", "11+6√2=9+2+2√(9×2)。", "因此 √(11+3√8)=3+√2。"], "ans": "3+√2", "tag": "常考"}, {"q": "若 √(11+3√8)=1+√2，是否正確？", "steps": ["(1+√2)²=3+2√2，與 11+6√2 不同。", "正確拆法是 9+2+6√2。"], "ans": "不正確；正確為 3+√2", "tag": "易錯"}]}, {"title": "實數的運算與性質", "desc": "不要把「有理數的封閉性」誤用到無理數。", "formulas": [["有理數四則封閉", "有理數加、減、乘，及除以非零有理數，結果仍有理"], ["無理數不封閉", "√2+(-√2)=0；√2×√2=2"], ["根式線性比較", "a+b√2=0 且 a,b 為有理數 → a=b=0"], ["大小與順序", "實數可在數線上排序；平方前要注意正負"], ["分配與結合", "(a+b)c=ac+bc；加法、乘法具有交換與結合律"]], "examples": [{"q": "判斷：若 a、b 是無理數，則 a+b 必為無理數。", "steps": ["取 a=√2、b=−√2。", "a+b=0 是有理數。"], "ans": "錯", "tag": "基礎"}, {"q": "判斷：a 為無理數，則 a⁶ 必為無理數。", "steps": ["取 a=√2。", "a⁶=(√2)⁶=8 是有理數。"], "ans": "錯", "tag": "易錯"}, {"q": "已知 a、b 為有理數且 a+b√2=0，求 a、b。", "steps": ["若 b≠0，則 √2=−a/b 會是有理數，矛盾。", "因此 b=0，接著 a=0。"], "ans": "a=0、b=0", "tag": "常考"}, {"q": "若 a、b 都是無理數，a/b 必為無理數嗎？", "steps": ["取 a=b=√2。", "a/b=1 為有理數。"], "ans": "不一定", "tag": "基礎"}, {"q": "設 x、y 為整數，且 x+y√(11−6√2)=x√(18+8√2)+6，求 x、y。", "steps": ["√(11−6√2)=3−√2。", "√(18+8√2)=4+√2。", "代入 x+y(3−√2)=x(4+√2)+6。", "比較有理、無理係數：x+3y=4x+6、−y=x。", "代入 y=−x 得 −6x=6。"], "ans": "x=−1、y=1", "tag": "進階"}]}, {"title": "算術平均數與幾何平均數", "desc": "「正數、固定和求最大乘積；固定積求最小和」是本節主軸。", "formulas": [["AM–GM", "a,b≥0 → (a+b)/2≥√ab；等號成立 a=b"], ["固定和", "a+b=S，ab≤(S/2)²"], ["固定積", "ab=P>0，a+b≥2√P"], ["配方技巧", "x²+y²≥2xy；(x+y)²≥4xy"], ["適用條件", "使用 AM–GM 前，先確認各項非負；等號是否能成立"]], "examples": [{"q": "矩形周長 68 公尺，面積最大多少？", "steps": ["設長 a、寬 b，2(a+b)=68，所以 a+b=34。", "ab≤((a+b)/2)²=17²。", "當 a=b=17 時取等號。"], "ans": "289 平方公尺", "tag": "常考"}, {"q": "a,b>0 且 ab=36，求 4/a+9/b 的最小值。", "steps": ["(4/a)(9/b)=36/(ab)=1。", "依 AM–GM：4/a+9/b≥2√1=2。", "等號 4/a=9/b 且 ab=36，解得 a=4、b=9。"], "ans": "2", "tag": "常考"}, {"q": "x,y>0 且 2x+y=8，求 (2+1/x)(1+1/y) 的最小值。", "steps": ["展開：(2+1/x)(1+1/y)=2+(2x+y+1)/(xy)=2+9/(xy)。", "由 2x+y=8，(2x)y≤((2x+y)/2)²=16。", "故 xy≤8，9/(xy)≥9/8。", "等號在 2x=y=4，即 x=2、y=4。"], "ans": "25/8", "tag": "進階"}, {"q": "x>−3，求 (x²+3x+1)/(x+3) 的最小值。", "steps": ["長除法：(x²+3x+1)/(x+3)=x+1/(x+3)。", "令 t=x+3>0，則 x=t−3。", "原式=t+1/t−3≥2−3。", "等號 t=1，x=−2。"], "ans": "−1", "tag": "常考"}, {"q": "若 x、y 為正實數且 2x+3y=12，求 4ˣ+8ʸ 的最小值。", "steps": ["4ˣ+8ʸ=2^(2x)+2^(3y)。", "AM–GM：≥2√(2^(2x+3y))=2×2⁶=128。", "等號 2x=3y=6，即 x=3、y=2。"], "ans": "128", "tag": "進階"}]}, {"title": "絕對值與不等式", "desc": "絕對值就是「距離」，永遠不會是負數；先找零點再分段。", "formulas": [["距離意義", "|x−a| 表示 x 與 a 在數線上的距離"], ["單一絕對值", "|x−a|≤r → a−r≤x≤a+r（r≥0）；|x−a|≥r → x≤a−r 或 x≥a+r"], ["三角不等式", "|a+b|≤|a|+|b|；||a|−|b||≤|a−b|"], ["分段技巧", "找出每個 |...|=0 的分界點，逐段拆掉絕對值"], ["等號條件", "|a+b|=|a|+|b| 當 ab≥0"], ["整數解", "解出區間後，逐一檢查端點有沒有包含"]], "examples": [{"q": "若 |ax+4|≤b 的解為 −5≤x≤9，求 a+b。", "steps": ["區間中點為2，所以 −4/a=2，a=−2。", "半徑為7，所以 b/|a|=7，b=14。", "a+b=−2+14。"], "ans": "12", "tag": "常考"}, {"q": "解聯立不等式 |4x+8|≤28 且 |x−2|≥5。", "steps": ["第一式 −28≤4x+8≤28 → −9≤x≤5。", "第二式 x−2≤−5 或 x−2≥5 → x≤−3 或 x≥7。", "取交集。"], "ans": "−9≤x≤−3", "tag": "常考"}, {"q": "若 |5n−21|≥7|n|，n 為整數，求所有解的個數。", "steps": ["平方：(5n−21)²≥49n²。", "展開整理：24n²+210n−441≤0。", "解根：−21/2≤n≤7/4。", "整數 n=−10,−9,…,1。"], "ans": "12 個", "tag": "進階"}, {"q": "求 |x−3|+|2x−1|=8 的所有實數解。", "steps": ["分界點為 x=1/2、x=3。", "x<1/2：3−x+1−2x=8 → x=−4/3。", "1/2≤x<3：3−x+2x−1=8 → x=6，不在區間。", "x≥3：x−3+2x−1=8 → x=4。"], "ans": "x=−4/3 或 x=4", "tag": "常考"}, {"q": "若 |x+5|−|6−x|=k 有解，k 為整數，求 k 的可能個數。", "steps": ["由反三角不等式，−|11|≤|x+5|−|x−6|≤|11|。", "因此 −11≤k≤11。", "整數從 −11 到 11，共 23 個。"], "ans": "23", "tag": "常考"}, {"q": "選出無解的方程式：|x−2|+|x−5|=2；|x−2|+|x−5|=4；|x−2|−|x−5|=5；|x−2|+|x−5|=1；|x−2|−|x−5|=−2。", "steps": ["兩點 2、5 距離為3，因此 |x−2|+|x−5|≥3。", "距離差的絕對值≤3，因此 |x−2|−|x−5| 介於 −3 與3。", "(A) 右邊2<3 無解；(C) 右邊5>3 無解；(D) 右邊1<3 無解。"], "ans": "A、C、D", "tag": "常考"}, {"q": "解 |x−1|≤|3x+2|+1。", "steps": ["以 x=1、x=−2/3 分段。", "x≥1：x−1≤3x+3 恒成立。", "−2/3≤x<1：1−x≤3x+3 → x≥−1/2。", "x<−2/3：1−x≤−3x−1 → x≤−1。", "合併解集。"], "ans": "x≤−1 或 x≥−1/2", "tag": "進階"}]}];const sections=DATA;let total=0;const root=document.getElementById('content');function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}sections.forEach((s,i)=>{const node=document.createElement('section');node.className='unit';node.id='unit'+
